apply plugin: 'com.android.application'

android {
    namespace 'com.timecard.tracker'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.timecard.tracker"
        minSdk 26
        targetSdk 34
        versionCode 2026111304
        versionName "2.4.6"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android SDK (zero external dependency bloat)
}
