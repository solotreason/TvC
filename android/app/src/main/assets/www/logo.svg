<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (64x64 centered at x=8, y=8, transparent outside, no protruding top bar) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#logoBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="32" cy="27" r="16" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="2 3"/>
    <circle cx="32" cy="27" r="16" fill="none" stroke="url(#logoGold)" stroke-width="2.3" stroke-dasharray="34 80" stroke-linecap="round"/>
    <line x1="32" y1="27" x2="32" y2="16" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="27" x2="22" y2="27" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" y="27" cy="27" r="2.4" fill="#f59e0b"/>
    <path d="M17 45 L25 45 M21 45 L21 54" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M28 47 L32 54 L36 47" fill="none" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 46.5 C43.5 44, 39.5 47, 39.5 49.8 C39.5 52.5, 43.5 55, 47 52.8" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="88" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#1e293b" letter-spacing="-0.5">
    TvC
