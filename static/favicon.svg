<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Clean Rounded Squircle on Transparent Canvas (No sticking-out top bar or white background) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5"/>

  <!-- Dial Gauge Ring -->
  <circle cx="64" cy="54" r="32" fill="none" stroke="#334155" stroke-width="3.2" stroke-dasharray="3 4"/>
  <circle cx="64" cy="54" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="65 150" stroke-linecap="round"/>

  <!-- Clock Punch Ticks -->
  <circle cx="64" cy="22" r="2.5" fill="#f59e0b"/>
  <circle cx="96" cy="54" r="2.2" fill="#94a3b8"/>
  <circle cx="32" cy="54" r="2.5" fill="#f59e0b"/>

  <!-- Center Clock Hands (9:00 punch start) -->
  <line x1="64" y1="54" x2="64" y2="33" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="54" x2="45" y2="54" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="64" cy="54" r="4.2" fill="#f59e0b"/>

  <!-- Stylized TvC Monogram -->
  <g>
    <!-- 'T' -->
    <path d="M35 88 L51 88 M43 88 L43 106" fill="none" stroke="#fbbf24" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 'v' -->
    <path d="M56 92 L64 106 L72 92" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 'C' -->
    <path d="M93 91 C86 86, 78 92, 78 97.5 C78 103, 86 108, 93 103.5" fill="none" stroke="#fbbf24" stroke-width="4.2" stroke-linecap="round"/>
  </g>
</svg>
