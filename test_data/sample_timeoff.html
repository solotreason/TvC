<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time Off Viewer</title>
</head>
<body>
  <div class="timeoff-wrapper">
    <div class="employee-header">
      <span class="empId">1002003</span>
      <span class="empName">JANE DOE</span>
    </div>

    <div class="timeoff-list-view">
      <table>
        <tbody>
          <tr data-timeoff-type="VAC">
            <td>Vacation</td>
            <td>9.00</td>
            <td>Hours</td>
            <td>Thu 12/31/2026</td>
          </tr>
          <tr data-timeoff-type="SIC">
            <td>Sick Leave</td>
            <td>40.00</td>
            <td>Hours</td>
            <td>Thu 12/31/2026</td>
          </tr>
          <tr data-timeoff-type="OPW">
            <td>Option Week</td>
            <td>40.00</td>
            <td>Hours</td>
            <td>Thu 12/31/2026</td>
          </tr>
          <tr data-timeoff-type="OPT">
            <td>Option Day</td>
            <td>8.00</td>
            <td>Hours</td>
            <td>Thu 12/31/2026</td>
          </tr>
          <tr data-timeoff-type="BRT">
            <td>Birthday</td>
            <td>8.00</td>
            <td>Hours</td>
            <td>N/A</td>
          </tr>
          <tr data-timeoff-type="ANN">
            <td>Anniversary</td>
            <td>8.00</td>
            <td>Hours</td>
            <td>N/A</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
